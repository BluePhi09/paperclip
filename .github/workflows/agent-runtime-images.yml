name: Agent runtime images

on:
  push:
    branches: [master]
    paths:
      - "docker/agent-runtime/**"
      - "tools/agent-shim/**"
      - ".github/workflows/agent-runtime-images.yml"
  schedule:
    # Weekly rebuild so the harness CLIs installed via `npm install -g
    # <pkg>@latest` in the Dockerfiles (claude-code, codex, gemini-cli,
    # opencode-ai, pi-coding-agent) stay current even when nothing under
    # docker/agent-runtime changes. Without this, the published images
    # silently drift behind upstream CLI releases (see #13544, #8757) until
    # someone happens to touch this path.
    - cron: "17 6 * * 1"
  workflow_dispatch:
    inputs:
      version:
        description: "Image version tag (e.g., v1.0.0 or dev-test)"
        required: true
        default: "dev"

permissions:
  contents: read
  packages: write
  id-token: write   # cosign keyless OIDC

env:
  REGISTRY: ghcr.io/paperclipai
  VERSION: ${{ github.event.inputs.version || format('git-{0}', github.sha) }}

jobs:
  check-for-cli-updates:
    # Runs on the weekly schedule only. Never pushes or signs anything —
    # it just builds the claude image locally (no --push) so it can read the
    # CLI version actually resolved by `npm install -g @latest` today, diffs
    # that against the version already published under :latest, and opens a
    # tracking issue if they differ. A human then reviews and runs
    # `workflow_dispatch` to trigger the real, signed, published build.
    #
    # This is deliberately NOT the same job as build-and-sign: publishing a
    # cosign-signed image straight from mutable `npm install -g <pkg>@latest`
    # resolution, with no human in the loop, means a compromised upstream npm
    # release could get built, signed, and pushed to GHCR fully unattended by
    # this cron alone. Keeping the schedule limited to "detect and notify"
    # keeps every signed, published image behind an explicit push or manual
    # workflow_dispatch from a trusted maintainer.
    if: github.event_name == 'schedule'
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build claude image locally (no push, no sign)
        run: |
          docker buildx bake \
            -f docker/agent-runtime/buildx-bake.hcl \
            claude \
            --load

      - name: Compare local CLI version against published :latest
        id: diff
        run: |
          LOCAL_VERSION=$(docker run --rm --entrypoint claude "${{ env.REGISTRY }}/agent-runtime-claude:${{ env.VERSION }}" --version || echo "unknown")
          docker pull "${{ env.REGISTRY }}/agent-runtime-claude:latest" || true
          PUBLISHED_VERSION=$(docker run --rm --entrypoint claude "${{ env.REGISTRY }}/agent-runtime-claude:latest" --version 2>/dev/null || echo "unavailable")
          echo "local=$LOCAL_VERSION" >> "$GITHUB_OUTPUT"
          echo "published=$PUBLISHED_VERSION" >> "$GITHUB_OUTPUT"
          if [ "$LOCAL_VERSION" != "$PUBLISHED_VERSION" ]; then
            echo "stale=true" >> "$GITHUB_OUTPUT"
          else
            echo "stale=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Open a tracking issue if the published image is stale
        if: steps.diff.outputs.stale == 'true'
        uses: actions/github-script@v8
        with:
          script: |
            const local = "${{ steps.diff.outputs.local }}";
            const published = "${{ steps.diff.outputs.published }}";
            const title = "agent-runtime-claude image is behind the latest Claude Code CLI";
            const body = `The weekly agent-runtime CLI check found a newer Claude Code CLI than what's published:\n\n- Currently published (\`:latest\`): \`${published}\`\n- Resolved by a fresh \`npm install -g @anthropic-ai/claude-code@latest\` build today: \`${local}\`\n\nThis issue is opened automatically instead of auto-publishing, so a maintainer reviews the upstream release before it gets built, signed, and pushed. To publish the refreshed image, trigger the \`Agent runtime images\` workflow manually via \`workflow_dispatch\`.`;
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              labels: "agent-runtime-stale-image",
            });
            if (existing.data.length > 0) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.data[0].number,
                body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ["agent-runtime-stale-image"],
              });
            }

  build-and-sign:
    # Deliberately excludes `schedule` — publishing signed images stays behind
    # a human-initiated push or workflow_dispatch. See check-for-cli-updates
    # above for what the weekly schedule actually does.
    if: github.event_name != 'schedule'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log into GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Build + push all deployed harness images (linux/amd64)
        id: bake
        run: |
          # Scope: the five harnesses the kubernetes sandbox provider supports
          # out of the box (opencode, pi, codex, gemini, claude). acpx/hermes
          # have Dockerfiles in the bake group but are not published by default.
          # Platforms come from the bake HCL (linux/amd64).
          # Use --push rather than a "*.push" --set so the wildcard does not hit
          # the bake group (which has no such key -> "unknown key" error).
          docker buildx bake \
            -f docker/agent-runtime/buildx-bake.hcl \
            base opencode pi codex gemini claude \
            --push \
            --metadata-file=bake-metadata.json
          # Extract digests for cosign signing
          BASE_DIGEST=$(jq -r '."base"."containerimage.digest"' bake-metadata.json)
          OPENCODE_DIGEST=$(jq -r '."opencode"."containerimage.digest"' bake-metadata.json)
          PI_DIGEST=$(jq -r '."pi"."containerimage.digest"' bake-metadata.json)
          CODEX_DIGEST=$(jq -r '."codex"."containerimage.digest"' bake-metadata.json)
          GEMINI_DIGEST=$(jq -r '."gemini"."containerimage.digest"' bake-metadata.json)
          CLAUDE_DIGEST=$(jq -r '."claude"."containerimage.digest"' bake-metadata.json)
          echo "base_digest=$BASE_DIGEST" >> "$GITHUB_OUTPUT"
          echo "opencode_digest=$OPENCODE_DIGEST" >> "$GITHUB_OUTPUT"
          echo "pi_digest=$PI_DIGEST" >> "$GITHUB_OUTPUT"
          echo "codex_digest=$CODEX_DIGEST" >> "$GITHUB_OUTPUT"
          echo "gemini_digest=$GEMINI_DIGEST" >> "$GITHUB_OUTPUT"
          echo "claude_digest=$CLAUDE_DIGEST" >> "$GITHUB_OUTPUT"
        env:
          VERSION: ${{ env.VERSION }}
          REGISTRY: ${{ env.REGISTRY }}

      - name: Cosign sign base
        run: |
          cosign sign --yes "${{ env.REGISTRY }}/agent-runtime-base@${{ steps.bake.outputs.base_digest }}"

      - name: Cosign sign opencode
        run: |
          cosign sign --yes "${{ env.REGISTRY }}/agent-runtime-opencode@${{ steps.bake.outputs.opencode_digest }}"

      - name: Cosign sign pi
        run: |
          cosign sign --yes "${{ env.REGISTRY }}/agent-runtime-pi@${{ steps.bake.outputs.pi_digest }}"

      - name: Cosign sign codex
        run: |
          cosign sign --yes "${{ env.REGISTRY }}/agent-runtime-codex@${{ steps.bake.outputs.codex_digest }}"

      - name: Cosign sign gemini
        run: |
          cosign sign --yes "${{ env.REGISTRY }}/agent-runtime-gemini@${{ steps.bake.outputs.gemini_digest }}"

      - name: Cosign sign claude
        run: |
          cosign sign --yes "${{ env.REGISTRY }}/agent-runtime-claude@${{ steps.bake.outputs.claude_digest }}"
