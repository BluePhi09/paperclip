name: Agent runtime images

on:
  push:
    branches: [master]
    paths:
      - "docker/agent-runtime/**"
      - "tools/agent-shim/**"
      - ".github/workflows/agent-runtime-images.yml"
  schedule:
    # Weekly rebuild so the harness CLIs installed via `npm install -g
    # <pkg>@latest` in the Dockerfiles (claude-code, codex, gemini-cli,
    # opencode-ai, pi-coding-agent) stay current even when nothing under
    # docker/agent-runtime changes. Without this, the published images
    # silently drift behind upstream CLI releases (see #13544, #8757) until
    # someone happens to touch this path.
    - cron: "17 6 * * 1"
  workflow_dispatch:
    inputs:
      version:
        description: "Image version tag (e.g., v1.0.0 or dev-test)"
        required: true
        default: "dev"

permissions:
  contents: read
  packages: write
  id-token: write   # cosign keyless OIDC
  actions: read     # "Wait for earlier manual builds" lists this workflow's runs

# Push-triggered runs on the same ref serialize against each other so two
# overlapping builds can't publish the floating :latest alias out of order
# (see build-and-sign's "Alias digests under a stable :latest tag" step).
# `cancel-in-progress: false` queues the newer run instead of killing the older
# one mid-push. GitHub keeps only the newest pending run per group, which is
# what we want for pushes: the latest commit is the one :latest should reach.
#
# workflow_dispatch runs must never be dropped that way (an explicitly
# requested version tag would silently never get published), so each gets its
# own group and is serialized by the "Wait for earlier manual builds" step
# instead, which has no pending-run limit and isn't affected by Actions'
# case-insensitive group names.
concurrency:
  group: ${{ github.event_name == 'workflow_dispatch' && format('agent-runtime-images-dispatch-{0}', github.run_id) || format('agent-runtime-images-{0}', github.ref) }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io/paperclipai
  VERSION: ${{ github.event.inputs.version || format('git-{0}', github.sha) }}

jobs:
  check-for-cli-updates:
    # Runs on the weekly schedule only, and never builds, signs, or pushes
    # anything. It reads the `npm install -g <pkg>@latest` package name out
    # of each agent-runtime Dockerfile, queries the npm registry (a
    # read-only, unauthenticated call) for that package's current latest
    # version, and opens/updates a single tracking issue listing what it
    # found. A human reviews the issue and decides whether to trigger a
    # real, signed, published rebuild via workflow_dispatch.
    #
    # Deliberately NOT a docker build: publishing a cosign-signed image
    # straight from a mutable `npm install -g <pkg>@latest` resolution, with
    # no human in the loop, means a compromised upstream npm release could
    # get built, signed, and pushed to GHCR fully unattended by this cron
    # alone. Even a *local* (unpushed) build was rejected in review as an
    # unnecessary CI cost/attack surface increase for what is fundamentally
    # a version-string comparison. Keeping the schedule to a metadata-only
    # npm registry query keeps every signed, published image behind an
    # explicit push or manual workflow_dispatch from a trusted maintainer.
    if: github.event_name == 'schedule'
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Resolve each harness's npm package and current npm-latest version
        id: versions
        run: |
          set -euo pipefail
          declare -A PACKAGES=(
            [claude]="@anthropic-ai/claude-code"
            [codex]="@openai/codex"
            [gemini]="@google/gemini-cli"
            [opencode]="opencode-ai"
            [pi]="@mariozechner/pi-coding-agent"
          )
          echo "table<<EOF" >> "$GITHUB_OUTPUT"
          for harness in "${!PACKAGES[@]}"; do
            pkg="${PACKAGES[$harness]}"
            # Sanity-check the Dockerfile still installs this exact package,
            # so this table can't silently drift from what actually ships.
            if ! grep -q "npm install -g ${pkg}@latest" "docker/agent-runtime/Dockerfile.${harness}"; then
              echo "::warning::docker/agent-runtime/Dockerfile.${harness} no longer installs ${pkg}@latest -- update the PACKAGES map in this workflow"
            fi
            latest=$(curl -fsSL --retry 3 "https://registry.npmjs.org/${pkg}/latest" | jq -r '.version // empty') || true
            latest="${latest:-unknown}"

            # Read the CLI version baked into the currently published ":latest"
            # image (the tag the Kubernetes sandbox provider's built-in adapter
            # defaults pull) straight from the installed package's
            # package.json. The image is pulled and `docker create`d but never
            # started: nothing from the image is executed on this runner, so a
            # compromised upstream release baked into a published image can't
            # run code here. The npm-registry value above is likewise only
            # ever treated as a string.
            image="ghcr.io/paperclipai/agent-runtime-${harness}:latest"
            deployed=""
            if docker pull --quiet "${image}" >/dev/null 2>&1 \
              && cid=$(docker create "${image}" 2>/dev/null); then
              deployed=$(docker cp "${cid}:/usr/lib/node_modules/${pkg}/package.json" - 2>/dev/null \
                | tar -xO 2>/dev/null | jq -r '.version // empty' 2>/dev/null || true)
              docker rm "${cid}" >/dev/null 2>&1 || true
            fi

            # Only call an image STALE when both versions were actually
            # established. A failed registry/GHCR lookup (outage, image not
            # published yet, package moved) is reported as UNKNOWN so it
            # doesn't prompt an unnecessary rebuild.
            if [ -z "${deployed}" ] || [ "${latest}" = "unknown" ]; then
              deployed="${deployed:-unknown}"
              status="UNKNOWN (check failed)"
            elif [ "${deployed}" = "${latest}" ]; then
              status="up to date"
            else
              status="STALE"
            fi

            echo "| \`agent-runtime-${harness}\` | \`${pkg}\` | ${latest} | ${deployed} | ${status} |" >> "$GITHUB_OUTPUT"
          done
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Ensure the tracking label exists
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create agent-runtime-cli-check \
            --repo "${{ github.repository }}" \
            --color "fbca04" \
            --description "Weekly agent-runtime CLI version check" \
            2>/dev/null || true

      - name: Open or update the weekly tracking issue
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          # Passed via env, not interpolated into the script string, so the
          # npm-derived table content can never be read as JavaScript.
          VERSION_TABLE: ${{ steps.versions.outputs.table }}
        with:
          script: |
            const table = process.env.VERSION_TABLE;
            const title = "Weekly agent-runtime CLI version check";
            const body = [
              "Automated weekly check of the npm packages installed by the",
              "`agent-runtime-*` Dockerfiles, compared against the CLI version",
              "actually baked into each currently published `:latest` image",
              "(pulled read-only from GHCR and probed with `--version` -- no",
              "build, sign, or push happens here). Trigger `workflow_dispatch`",
              "on the `Agent runtime images` workflow for any row marked STALE.",
              "",
              "| Image | npm package | npm latest | deployed (`:latest`) | status |",
              "| --- | --- | --- | --- | --- |",
              table.trim(),
            ].join("\n");
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              labels: "agent-runtime-cli-check",
            });
            if (existing.data.length > 0) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.data[0].number,
                body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ["agent-runtime-cli-check"],
              });
            }

  build-and-sign:
    # Deliberately excludes `schedule` -- publishing signed images stays
    # behind a human-initiated push or workflow_dispatch. See
    # check-for-cli-updates above for what the weekly schedule actually does.
    if: github.event_name != 'schedule'
    runs-on: ubuntu-22.04
    steps:
      - name: Wait for earlier manual builds
        # Serialize manual builds in start order so two dispatches for the same
        # version can't interleave their pushes and leave the six tags pointing
        # at different commits. Run ids only increase, so the oldest run never
        # waits and this can't deadlock.
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Fails the step (bash -e) if the API call fails, rather than
          # building unserialized.
          while true; do
            older=$(gh run list --repo "${{ github.repository }}" \
              --workflow agent-runtime-images.yml --event workflow_dispatch \
              --limit 100 --json databaseId,status \
              --jq '[.[] | select(.databaseId < ${{ github.run_id }} and .status != "completed")] | length')
            [ "${older}" = "0" ] && break
            echo "Waiting for ${older} earlier manual build(s) to finish..."
            sleep 30
          done

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: Log into GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install cosign
        uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3

      - name: Build + push all deployed harness images (linux/amd64)
        id: bake
        run: |
          # Scope: the five harnesses the kubernetes sandbox provider supports
          # out of the box (opencode, pi, codex, gemini, claude). acpx/hermes
          # have Dockerfiles in the bake group but are not published by default.
          # Platforms come from the bake HCL (linux/amd64).
          # Use --push rather than a "*.push" --set so the wildcard does not hit
          # the bake group (which has no such key -> "unknown key" error).
          docker buildx bake \
            -f docker/agent-runtime/buildx-bake.hcl \
            base opencode pi codex gemini claude \
            --push \
            --metadata-file=bake-metadata.json
          # Extract digests for cosign signing
          BASE_DIGEST=$(jq -r '."base"."containerimage.digest"' bake-metadata.json)
          OPENCODE_DIGEST=$(jq -r '."opencode"."containerimage.digest"' bake-metadata.json)
          PI_DIGEST=$(jq -r '."pi"."containerimage.digest"' bake-metadata.json)
          CODEX_DIGEST=$(jq -r '."codex"."containerimage.digest"' bake-metadata.json)
          GEMINI_DIGEST=$(jq -r '."gemini"."containerimage.digest"' bake-metadata.json)
          CLAUDE_DIGEST=$(jq -r '."claude"."containerimage.digest"' bake-metadata.json)
          echo "base_digest=$BASE_DIGEST" >> "$GITHUB_OUTPUT"
          echo "opencode_digest=$OPENCODE_DIGEST" >> "$GITHUB_OUTPUT"
          echo "pi_digest=$PI_DIGEST" >> "$GITHUB_OUTPUT"
          echo "codex_digest=$CODEX_DIGEST" >> "$GITHUB_OUTPUT"
          echo "gemini_digest=$GEMINI_DIGEST" >> "$GITHUB_OUTPUT"
          echo "claude_digest=$CLAUDE_DIGEST" >> "$GITHUB_OUTPUT"
        env:
          VERSION: ${{ env.VERSION }}
          REGISTRY: ${{ env.REGISTRY }}

      - name: Cosign sign base
        run: |
          cosign sign --yes "${{ env.REGISTRY }}/agent-runtime-base@${{ steps.bake.outputs.base_digest }}"

      - name: Cosign sign opencode
        run: |
          cosign sign --yes "${{ env.REGISTRY }}/agent-runtime-opencode@${{ steps.bake.outputs.opencode_digest }}"

      - name: Cosign sign pi
        run: |
          cosign sign --yes "${{ env.REGISTRY }}/agent-runtime-pi@${{ steps.bake.outputs.pi_digest }}"

      - name: Cosign sign codex
        run: |
          cosign sign --yes "${{ env.REGISTRY }}/agent-runtime-codex@${{ steps.bake.outputs.codex_digest }}"

      - name: Cosign sign gemini
        run: |
          cosign sign --yes "${{ env.REGISTRY }}/agent-runtime-gemini@${{ steps.bake.outputs.gemini_digest }}"

      - name: Cosign sign claude
        run: |
          cosign sign --yes "${{ env.REGISTRY }}/agent-runtime-claude@${{ steps.bake.outputs.claude_digest }}"

      - name: Alias digests under a stable :latest tag
        # The bake step above only ever pushes the VERSION tag (a git-sha on
        # push, or an arbitrary string on manual dispatch). Self-hosters
        # configuring the kubernetes-sandbox plugin have no way to discover or
        # pin the newest git-sha tag, and the plugin's built-in adapter-defaults
        # point at a ":v1" tag that has never been published (#8757, #13544
        # blocker 2), so every unconfigured self-host install gets
        # ImagePullBackOff. `imagetools create` re-tags the already-pushed
        # digest without rebuilding, so this is push-cost only. Skip on manual
        # dispatch with a custom version — only automated `push` runs move
        # the floating tag, so a one-off `workflow_dispatch` test build can
        # never clobber :latest for real deployments.
        if: github.event_name != 'workflow_dispatch'
        run: |
          docker buildx imagetools create -t "${{ env.REGISTRY }}/agent-runtime-base:latest"     "${{ env.REGISTRY }}/agent-runtime-base@${{ steps.bake.outputs.base_digest }}"
          docker buildx imagetools create -t "${{ env.REGISTRY }}/agent-runtime-opencode:latest" "${{ env.REGISTRY }}/agent-runtime-opencode@${{ steps.bake.outputs.opencode_digest }}"
          docker buildx imagetools create -t "${{ env.REGISTRY }}/agent-runtime-pi:latest"       "${{ env.REGISTRY }}/agent-runtime-pi@${{ steps.bake.outputs.pi_digest }}"
          docker buildx imagetools create -t "${{ env.REGISTRY }}/agent-runtime-codex:latest"    "${{ env.REGISTRY }}/agent-runtime-codex@${{ steps.bake.outputs.codex_digest }}"
          docker buildx imagetools create -t "${{ env.REGISTRY }}/agent-runtime-gemini:latest"   "${{ env.REGISTRY }}/agent-runtime-gemini@${{ steps.bake.outputs.gemini_digest }}"
          docker buildx imagetools create -t "${{ env.REGISTRY }}/agent-runtime-claude:latest"   "${{ env.REGISTRY }}/agent-runtime-claude@${{ steps.bake.outputs.claude_digest }}"
