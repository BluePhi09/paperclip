name: Agent runtime images

on:
  push:
    branches: [master]
    paths:
      - "docker/agent-runtime/**"
      - "tools/agent-shim/**"
      - ".github/workflows/agent-runtime-images.yml"
  workflow_dispatch:
    inputs:
      version:
        description: "Image version tag (e.g., v1.0.0 or dev-test)"
        required: true
        default: "dev"

permissions:
  contents: read
  packages: write
  id-token: write   # cosign keyless OIDC
  actions: read     # "Wait for earlier manual builds" lists this workflow's runs

# Push-triggered runs on the same ref serialize against each other so two
# overlapping builds can't publish the floating :latest alias out of order
# (see build-and-sign's "Alias digests under a stable :latest tag" step).
# `cancel-in-progress: false` queues the newer run instead of killing the older
# one mid-push. GitHub keeps only the newest pending run per group, which is
# what we want for pushes: the latest commit is the one :latest should reach.
#
# workflow_dispatch runs must never be dropped that way (an explicitly
# requested version tag would silently never get published), so each gets its
# own group and is serialized by the "Wait for earlier manual builds" step
# instead, which has no pending-run limit and isn't affected by Actions'
# case-insensitive group names.
concurrency:
  group: ${{ github.event_name == 'workflow_dispatch' && format('agent-runtime-images-dispatch-{0}', github.run_id) || format('agent-runtime-images-{0}', github.ref) }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io/paperclipai
  VERSION: ${{ github.event.inputs.version || format('git-{0}', github.sha) }}

jobs:
  build-and-sign:
    runs-on: ubuntu-22.04
    steps:
      - name: Wait for earlier manual builds
        # Serialize manual builds in start order so two dispatches for the same
        # version can't interleave their pushes and leave the six tags pointing
        # at different commits. Run ids only increase, so the oldest run never
        # waits and this can't deadlock.
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Fails the step (bash -e) if the API call fails, rather than
          # building unserialized.
          while true; do
            older=$(gh run list --repo "${{ github.repository }}" \
              --workflow agent-runtime-images.yml --event workflow_dispatch \
              --limit 100 --json databaseId,status \
              --jq '[.[] | select(.databaseId < ${{ github.run_id }} and .status != "completed")] | length')
            [ "${older}" = "0" ] && break
            echo "Waiting for ${older} earlier manual build(s) to finish..."
            sleep 30
          done

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: Log into GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install cosign
        uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3

      - name: Build + push all deployed harness images (linux/amd64)
        id: bake
        run: |
          # Scope: the five harnesses the kubernetes sandbox provider supports
          # out of the box (opencode, pi, codex, gemini, claude). acpx/hermes
          # have Dockerfiles in the bake group but are not published by default.
          # Platforms come from the bake HCL (linux/amd64).
          # Use --push rather than a "*.push" --set so the wildcard does not hit
          # the bake group (which has no such key -> "unknown key" error).
          docker buildx bake \
            -f docker/agent-runtime/buildx-bake.hcl \
            base opencode pi codex gemini claude \
            --push \
            --metadata-file=bake-metadata.json
          # Extract digests for cosign signing
          BASE_DIGEST=$(jq -r '."base"."containerimage.digest"' bake-metadata.json)
          OPENCODE_DIGEST=$(jq -r '."opencode"."containerimage.digest"' bake-metadata.json)
          PI_DIGEST=$(jq -r '."pi"."containerimage.digest"' bake-metadata.json)
          CODEX_DIGEST=$(jq -r '."codex"."containerimage.digest"' bake-metadata.json)
          GEMINI_DIGEST=$(jq -r '."gemini"."containerimage.digest"' bake-metadata.json)
          CLAUDE_DIGEST=$(jq -r '."claude"."containerimage.digest"' bake-metadata.json)
          echo "base_digest=$BASE_DIGEST" >> "$GITHUB_OUTPUT"
          echo "opencode_digest=$OPENCODE_DIGEST" >> "$GITHUB_OUTPUT"
          echo "pi_digest=$PI_DIGEST" >> "$GITHUB_OUTPUT"
          echo "codex_digest=$CODEX_DIGEST" >> "$GITHUB_OUTPUT"
          echo "gemini_digest=$GEMINI_DIGEST" >> "$GITHUB_OUTPUT"
          echo "claude_digest=$CLAUDE_DIGEST" >> "$GITHUB_OUTPUT"
        env:
          VERSION: ${{ env.VERSION }}
          REGISTRY: ${{ env.REGISTRY }}

      - name: Cosign sign base
        run: |
          cosign sign --yes "${{ env.REGISTRY }}/agent-runtime-base@${{ steps.bake.outputs.base_digest }}"

      - name: Cosign sign opencode
        run: |
          cosign sign --yes "${{ env.REGISTRY }}/agent-runtime-opencode@${{ steps.bake.outputs.opencode_digest }}"

      - name: Cosign sign pi
        run: |
          cosign sign --yes "${{ env.REGISTRY }}/agent-runtime-pi@${{ steps.bake.outputs.pi_digest }}"

      - name: Cosign sign codex
        run: |
          cosign sign --yes "${{ env.REGISTRY }}/agent-runtime-codex@${{ steps.bake.outputs.codex_digest }}"

      - name: Cosign sign gemini
        run: |
          cosign sign --yes "${{ env.REGISTRY }}/agent-runtime-gemini@${{ steps.bake.outputs.gemini_digest }}"

      - name: Cosign sign claude
        run: |
          cosign sign --yes "${{ env.REGISTRY }}/agent-runtime-claude@${{ steps.bake.outputs.claude_digest }}"

      - name: Alias digests under a stable :latest tag
        # The bake step above only ever pushes the VERSION tag (a git-sha on
        # push, or an arbitrary string on manual dispatch). Self-hosters
        # configuring the kubernetes-sandbox plugin have no way to discover or
        # pin the newest git-sha tag, and the plugin's built-in adapter-defaults
        # point at a ":v1" tag that has never been published (#8757, #13544
        # blocker 2), so every unconfigured self-host install gets
        # ImagePullBackOff. `imagetools create` re-tags the already-pushed
        # digest without rebuilding, so this is push-cost only. Skip on manual
        # dispatch with a custom version — only automated `push` runs move
        # the floating tag, so a one-off `workflow_dispatch` test build can
        # never clobber :latest for real deployments.
        if: github.event_name != 'workflow_dispatch'
        run: |
          docker buildx imagetools create -t "${{ env.REGISTRY }}/agent-runtime-base:latest"     "${{ env.REGISTRY }}/agent-runtime-base@${{ steps.bake.outputs.base_digest }}"
          docker buildx imagetools create -t "${{ env.REGISTRY }}/agent-runtime-opencode:latest" "${{ env.REGISTRY }}/agent-runtime-opencode@${{ steps.bake.outputs.opencode_digest }}"
          docker buildx imagetools create -t "${{ env.REGISTRY }}/agent-runtime-pi:latest"       "${{ env.REGISTRY }}/agent-runtime-pi@${{ steps.bake.outputs.pi_digest }}"
          docker buildx imagetools create -t "${{ env.REGISTRY }}/agent-runtime-codex:latest"    "${{ env.REGISTRY }}/agent-runtime-codex@${{ steps.bake.outputs.codex_digest }}"
          docker buildx imagetools create -t "${{ env.REGISTRY }}/agent-runtime-gemini:latest"   "${{ env.REGISTRY }}/agent-runtime-gemini@${{ steps.bake.outputs.gemini_digest }}"
          docker buildx imagetools create -t "${{ env.REGISTRY }}/agent-runtime-claude:latest"   "${{ env.REGISTRY }}/agent-runtime-claude@${{ steps.bake.outputs.claude_digest }}"
